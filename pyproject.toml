[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prime-stardew"
version = "0.1.0"
description = "Continual-learning research harness for Stardew Valley and StarDojo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/prime_stardew"]
