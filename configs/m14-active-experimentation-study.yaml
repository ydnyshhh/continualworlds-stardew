schema_version: 1
study_id: m14-active-experimentation-v1
hypothesis: >-
  Under matched hidden mechanics, agent-selected information gathering increases net total reward
  relative to belief tracking without experimentation and abstains when expected experiment value
  is negative.
primary_metric: net_total_reward
favorable_direction: higher
paired: true
seeds: [406041616, 406041617, 406041618, 406041619, 406041620, 406041621, 406041622, 406041623]
conditions:
  - no_explicit_uncertainty
  - belief_tracking_only
  - agent_experimentation
  - oracle_experimentation
  - random_experimentation
alpha: 0.05
confidence_level: 0.95
bootstrap_samples: 10000
experiment_budget: 3
exclusions:
  - malformed or hash-invalid event chain
  - missing or duplicate terminal scenario event
  - mismatched hidden-world hash within a paired seed
  - infrastructure failure before a policy choice is recorded
stopping_rule: Execute every preregistered seed and condition exactly once; do not stop early.
analysis_plan: >-
  Pair agent_experimentation and belief_tracking_only within seed. Compute agent minus belief net
  total reward, its deterministic paired-bootstrap 95 percent confidence interval, and an exact
  two-sided sign test. The primary hypothesis passes only when the lower confidence bound is
  positive, p is below alpha, all pairs share the same hidden-world hash, all runs complete, and
  agent restraint is 100 percent on preregistered negative-expected-value scenarios. Other
  conditions and secondary metrics are descriptive. Report every failure and exclusion.

